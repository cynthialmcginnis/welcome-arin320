  .title { position: fixed; top: 24px; left: 28px; pointer-events: none; }
  .title .course { font-size: clamp(28px, 5vw, 56px); font-weight: 800; letter-spacing: 0.02em; line-height: 1; }
  .title .course span { color: #35d6e8; }
  .title .name { font-size: clamp(14px, 2vw, 22px); margin-top: 8px; color: #b8c8e6; }

    border: 10px solid transparent; border-top-color: #ffffff; border-bottom: 0; }

  .info { position: fixed; left: 0; right: 0; bottom: 0; padding: 40px 28px 20px;

<canvas id="scene" tabindex="0" aria-label="A 3D robot studying at a desk. Click the robot to see what to do before class."></canvas>

<div class="title">
  <div class="course">ARIN <span>320</span></div>
  <div class="name">Artificial Intelligence Applications</div>
</div>

<div class="hint">Click the robot. Drag to look around.</div>
<button id="save" type="button">Save image for email</button>
<div id="bubble" role="status" aria-live="polite"></div>

<div class="info">
  <div class="when" id="when"></div>
  <div class="prompt" id="prompt"></div>
  <ol class="steps" id="steps"></ol>
</div>

<script>
function startRobot() {
  // =====================================================================
  // TEXT YOU CAN CHANGE. Everything the students read is in this block.
  // =====================================================================
  var FIRST_CLASS = "First class: Tuesday, October 20 at 6:00 PM JST";
  var GREETING = "Welcome to ARIN 320! Click me. I will show you what to do before class.";
  // "chip" is the short label at the bottom of the screen. "say" is what the robot says.
  var STEPS = [
    { chip: "Welcome message",      say: "Read the Welcome message in LEO." },
    { chip: "Syllabus",             say: "Read the syllabus." },
    { chip: "Unit 0",               say: "Work through Unit 0. Watch the video and read the Unit 0 Guide." },
    { chip: "Meet Your Classmates", say: "Post in Meet Your Classmates." },
    { chip: "Discussion 0",         say: "Post Discussion 0. It is due Tuesday, October 20 at 6:00 PM JST." }
  ];
  var FINISH = "That is all of them. See you in class on Tuesday!";
  // Words that float up when the robot has an idea.
  var WORDS = ["data", "model", "training", "bias", "prediction", "ethics", "GenAI", "evidence", "accuracy", "decision"];
  // Text on the still image for the email.
  var IMAGE_BUBBLE = "Welcome to ARIN 320!";
  var IMAGE_BUTTON = "Click to meet the robot";
  // =====================================================================

  var N = STEPS.length;
  var canvas = document.getElementById("scene");
  var bubble = document.getElementById("bubble");
  var promptEl = document.getElementById("prompt");
  var stepsEl = document.getElementById("steps");
  document.getElementById("when").textContent = FIRST_CLASS;
  promptEl.textContent = "Click the robot to see what to do before class.";
  STEPS.forEach(function (s, i) {
    var li = document.createElement("li");
    li.textContent = (i + 1) + ". " + s.chip;
    stepsEl.appendChild(li);
  });

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1220);
  scene.fog = new THREE.Fog(0x0b1220, 13, 28);
  var camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
  var lookTarget = new THREE.Vector3(0, 2.25, -0.5);

  // ---------- Lights ----------
  scene.add(new THREE.HemisphereLight(0x5066a8, 0x0b1220, 0.8));
  var fill = new THREE.DirectionalLight(0x9bb7ff, 0.6);
  fill.position.set(4, 6, 6); scene.add(fill);
  var lampLight = new THREE.SpotLight(0xffd9a0, 1.9, 9, Math.PI / 3.2, 0.55, 1.2);
  lampLight.position.set(-1.25, 2.75, -0.15);
  lampLight.castShadow = true;
  lampLight.shadow.mapSize.set(1024, 1024);
  lampLight.shadow.bias = -0.0005;
  lampLight.target.position.set(0.1, 1.55, 0.05);
  scene.add(lampLight, lampLight.target);

  // ---------- Helpers ----------
  var V = function (x, y, z) { return new THREE.Vector3(x, y, z); };
  function mat(color, o) {
    o = o || {};
    return new THREE.MeshStandardMaterial({ color: color,
      roughness: o.roughness === undefined ? 0.6 : o.roughness,
      metalness: o.metalness === undefined ? 0.1 : o.metalness,
      side: o.side || THREE.FrontSide });
  }
  function shadowed(m) { m.castShadow = true; m.receiveShadow = true; return m; }
  function box(w, h, d, material, x, y, z) {
    var m = shadowed(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material));
    m.position.set(x, y, z); return m;
  }
  function cyl(rt, rb, h, material, x, y, z) {
    var m = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 28), material));
    m.position.set(x, y, z); return m;
  }
  function roundedBoxGeo(w, h, d, r) {
    var b = Math.min(r, 0.08), x = -(w / 2 - b), y = -(h / 2 - b), W = w - 2 * b, H = h - 2 * b, c = Math.max(0.001, r - b);
    var s = new THREE.Shape();
    s.moveTo(x + c, y); s.lineTo(x + W - c, y); s.quadraticCurveTo(x + W, y, x + W, y + c);
    s.lineTo(x + W, y + H - c); s.quadraticCurveTo(x + W, y + H, x + W - c, y + H);
    s.lineTo(x + c, y + H); s.quadraticCurveTo(x, y + H, x, y + H - c);
    s.lineTo(x, y + c); s.quadraticCurveTo(x, y, x + c, y);
    var g = new THREE.ExtrudeGeometry(s, { depth: d - 2 * b, bevelEnabled: true, bevelThickness: b, bevelSize: b, bevelSegments: 4, curveSegments: 8 });
    g.center(); return g;
  }
  var UP = V(0, 1, 0), tmpDir = V(0, 0, 0);
  function setBetween(mesh, a, b) {
    tmpDir.copy(b).sub(a);
    var len = tmpDir.length();
    mesh.position.copy(a).addScaledVector(tmpDir, 0.5);
    mesh.quaternion.setFromUnitVectors(UP, tmpDir.normalize());
    mesh.scale.y = len;
  }
  function staticLimb(a, b, r, material) {
    var m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 1, 16), material);
    setBetween(m, a, b); m.castShadow = true; return m;
  }
  function lerp(a, b, k) { return a + (b - a) * k; }
  function clamp01(x) { return Math.max(0, Math.min(1, x)); }
  function ease(x) { x = clamp01(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
  function seg(p, a, b) { return clamp01((p - a) / (b - a)); }

  // ---------- Room ----------
  var floor = new THREE.Mesh(new THREE.CircleGeometry(15, 64), mat(0x121c33, { roughness: 0.95 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
  var rug = new THREE.Mesh(new THREE.CircleGeometry(3.5, 64), mat(0x1c3158, { roughness: 1 }));
  rug.rotation.x = -Math.PI / 2; rug.position.y = 0.01; rug.receiveShadow = true; scene.add(rug);

  var wood = mat(0x8a5a36, { roughness: 0.7 }), woodDark = mat(0x5e3c22, { roughness: 0.8 });
  var DESK_Y = 1.5, TOP = DESK_Y + 0.06;
  scene.add(box(4.4, 0.12, 2.0, wood, 0, DESK_Y, 0));
  [[-2.05, -0.85], [2.05, -0.85], [-2.05, 0.85], [2.05, 0.85]].forEach(function (p) {
    scene.add(box(0.14, DESK_Y - 0.06, 0.14, woodDark, p[0], (DESK_Y - 0.06) / 2, p[1]));
  });

  // ---------- Robot ----------
  var shell = mat(0xdde4ee, { roughness: 0.4, metalness: 0.3 });
  var joint = mat(0x44506a, { roughness: 0.5, metalness: 0.5 });
  var teal = mat(0x18b6c9, { roughness: 0.4, metalness: 0.3 });
  var gold = mat(0xffc857, { roughness: 0.5, metalness: 0.2 });

  var robot = new THREE.Group(); scene.add(robot);
  robot.add(cyl(0.62, 0.7, 0.16, joint, 0, 0.08, -1.1));
  robot.add(cyl(0.2, 0.26, 1.3, joint, 0, 0.8, -1.1));

  var torso = shadowed(new THREE.Mesh(roundedBoxGeo(1.15, 1.2, 0.72, 0.14), shell));
  torso.position.set(0, 2.02, -1.1); robot.add(torso);
  robot.add(box(1.0, 0.09, 0.6, teal, 0, 1.44, -1.1));
  var chest = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.3), new THREE.MeshBasicMaterial({ color: 0x0c1830 }));
  chest.position.set(0, 2.16, -0.735); robot.add(chest);
  var chestBars = [];
  for (var i = 0; i < 5; i++) {
    var bar = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 0.2), new THREE.MeshBasicMaterial({ color: 0x35d6e8 }));
    bar.position.set(-0.2 + i * 0.1, 2.16, -0.73); robot.add(bar); chestBars.push(bar);
  }
  robot.add(cyl(0.14, 0.16, 0.24, joint, 0, 2.72, -1.1));

  var HEAD_Y = 3.14;
  var head = new THREE.Group();
  head.position.set(0, HEAD_Y, -1.05);
  head.rotation.order = "YXZ";
  robot.add(head);
  var skull = new THREE.Mesh(roundedBoxGeo(1.1, 0.86, 0.84, 0.16), shell);
  skull.castShadow = true; head.add(skull);

  // The face is drawn on a small canvas so the robot can change expression.
  var faceCanvas = document.createElement("canvas"); faceCanvas.width = 256; faceCanvas.height = 160;
  var fg = faceCanvas.getContext("2d");
  var faceTex = new THREE.CanvasTexture(faceCanvas);
  faceTex.encoding = THREE.sRGBEncoding;
  var facePlane = new THREE.Mesh(new THREE.PlaneGeometry(0.86, 0.54), new THREE.MeshBasicMaterial({ map: faceTex }));
  facePlane.position.set(0, 0, 0.423); head.add(facePlane);

  function drawFace(f) {
    fg.fillStyle = "#08111f"; fg.fillRect(0, 0, 256, 160);
    fg.shadowColor = "#35d6e8"; fg.shadowBlur = 14;
    fg.fillStyle = "#6ff3ff"; fg.strokeStyle = "#6ff3ff"; fg.lineCap = "round"; fg.lineWidth = 9;
    [78, 178].forEach(function (cx) {
      var x = cx + f.lookX * 9, y = 66 + f.lookY * 8;
      if (f.happy > 0.5) {
        fg.beginPath(); fg.arc(x, y + 10, 21, Math.PI * 1.08, Math.PI * 1.92); fg.stroke();
      } else {
        var ry = Math.max(2.5, 23 * f.wide * f.open);
        fg.beginPath(); fg.ellipse(x, y, 21 * f.wide, ry, 0, 0, Math.PI * 2); fg.fill();
      }
    });
    fg.lineWidth = 7;
    var mx = 128, my = 122;
    if (f.mouth === "smile") {
      fg.beginPath(); fg.arc(mx, my - 12, 24, Math.PI * 0.15, Math.PI * 0.85); fg.stroke();
    } else if (f.mouth === "o") {
      fg.beginPath(); fg.ellipse(mx, my, 10, 12, 0, 0, Math.PI * 2); fg.fill();
    } else if (f.mouth === "talk") {
      var h = 4 + 15 * f.mo;
      fg.beginPath(); fg.ellipse(mx, my, 20, h, 0, 0, Math.PI * 2); fg.fill();
    } else {
      fg.beginPath(); fg.moveTo(mx - 18, my); fg.lineTo(mx + 18, my); fg.stroke();
    }
    fg.shadowBlur = 0;
    faceTex.needsUpdate = true;
  }

  var earGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.1, 24);
  [-1, 1].forEach(function (s) {
    var ear = new THREE.Mesh(earGeo, teal);
    ear.rotation.z = Math.PI / 2; ear.position.set(0.59 * s, 0, 0); head.add(ear);
  });
  var antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.4, 12), joint);
  antenna.position.set(0, 0.62, 0); head.add(antenna);
  var bulbMat = new THREE.MeshStandardMaterial({ color: 0xffc857, emissive: 0xffc857, emissiveIntensity: 0.6 });
  var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 20, 16), bulbMat);
  bulb.position.set(0, 0.86, 0); head.add(bulb);
  var bulbLight = new THREE.PointLight(0xffc857, 0, 5);
  bulbLight.position.copy(bulb.position); head.add(bulbLight);
  var eyeGlow = new THREE.PointLight(0x35d6e8, 0.5, 3.5);
  eyeGlow.position.set(0, 0, 0.9); head.add(eyeGlow);

  // Arms: the shoulders stay put, the hands move, and the elbows are worked out each frame.
  var L1 = 0.76, L2 = 0.74;
  function makeArm(s) {
    var a = { s: s, shoulder: V(0.68 * s, 2.36, -1.02), hint: V(0.85 * s, -0.25, -0.6) };
    a.upper = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1, 18), shell);
    a.fore = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 1, 18), shell);
    a.elbow = new THREE.Mesh(new THREE.SphereGeometry(0.125, 20, 16), joint);
    a.hand = new THREE.Mesh(new THREE.SphereGeometry(0.135, 20, 16), teal);
    var sh = new THREE.Mesh(new THREE.SphereGeometry(0.17, 20, 16), joint);
    sh.position.copy(a.shoulder);
    [a.upper, a.fore, a.elbow, a.hand, sh].forEach(function (m) { m.castShadow = true; robot.add(m); });
    a.pos = V(0.8 * s, TOP + 0.14, 0.02);
    return a;
  }
  var armL = makeArm(-1), armR = makeArm(1);
  var ikDir = V(0, 0, 0), ikPole = V(0, 0, 0), ikElbow = V(0, 0, 0), ikHand = V(0, 0, 0);
  function solveArm(a) {
    ikDir.copy(a.pos).sub(a.shoulder);
    var d = Math.min(ikDir.length(), L1 + L2 - 0.02);
    ikDir.normalize();
    ikHand.copy(a.shoulder).addScaledVector(ikDir, d);
    var along = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - along * along));
    ikPole.copy(a.hint).addScaledVector(ikDir, -a.hint.dot(ikDir)).normalize();
    ikElbow.copy(a.shoulder).addScaledVector(ikDir, along).addScaledVector(ikPole, h);
    setBetween(a.upper, a.shoulder, ikElbow);
    setBetween(a.fore, ikElbow, ikHand);
    a.elbow.position.copy(ikElbow);
    a.hand.position.copy(ikHand);
  }

  // ---------- Book ----------
  function pageTexture() {
    var c = document.createElement("canvas"); c.width = 256; c.height = 320;
    var g = c.getContext("2d");
    g.fillStyle = "#f6efe0"; g.fillRect(0, 0, 256, 320);
    g.fillStyle = "#3a4763"; g.fillRect(24, 26, 130, 12);
    g.fillStyle = "#8b93a6";
    for (var y = 58; y < 300; y += 18) g.fillRect(24, y, 190 + ((y * 37) % 30) - (y % 54 === 4 ? 90 : 0), 5);
    var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  }
  var paper = new THREE.MeshStandardMaterial({ map: pageTexture(), roughness: 0.9, side: THREE.DoubleSide });
  var cover = mat(0x2a6f97, { roughness: 0.7 });
  var book = new THREE.Group(); book.position.set(0, TOP, 0.05); scene.add(book);
  [-1, 1].forEach(function (s) {
    var half = new THREE.Group(); half.rotation.z = -0.07 * s;
    var sheet = new THREE.Mesh(new THREE.PlaneGeometry(0.68, 0.9), paper);
    sheet.rotation.x = -Math.PI / 2; sheet.position.set(0.36 * s, 0.073, 0); sheet.receiveShadow = true;
    half.add(box(0.72, 0.07, 0.96, cover, 0.37 * s, 0.035, 0), sheet);
    book.add(half);
  });
  var flipGeo = new THREE.PlaneGeometry(0.66, 0.88);
  flipGeo.rotateX(-Math.PI / 2); flipGeo.translate(0.33, 0, 0);
  var flipPivot = new THREE.Group(); flipPivot.position.set(0, 0.085, 0);
  var flipPage = new THREE.Mesh(flipGeo, paper); flipPage.castShadow = true;
  flipPivot.add(flipPage); flipPivot.visible = false; book.add(flipPivot);

  // ---------- Lamp ----------
  var lampMetal = mat(0x2b3550, { roughness: 0.4, metalness: 0.6 });
  scene.add(cyl(0.26, 0.3, 0.07, lampMetal, -1.65, TOP + 0.035, -0.55));
  scene.add(staticLimb(V(-1.65, TOP + 0.05, -0.55), V(-1.8, 2.55, -0.6), 0.035, lampMetal));
  scene.add(staticLimb(V(-1.8, 2.55, -0.6), V(-1.3, 2.86, -0.22), 0.035, lampMetal));
  var shade = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.42, 28, 1, true), mat(0x18b6c9, { roughness: 0.5, metalness: 0.3, side: THREE.DoubleSide }));
  shade.position.set(-1.25, 2.78, -0.15); shade.rotation.set(0.25, 0, -0.55); scene.add(shade);
  var lampBulb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 18, 14), new THREE.MeshBasicMaterial({ color: 0xffe6b8 }));
  lampBulb.position.set(-1.2, 2.68, -0.12); scene.add(lampBulb);

  // ---------- Book stack and mug ----------
  var sy = TOP;
  [0xc8553d, 0xf2b84b, 0x3d8f6f, 0x6f5bb5].forEach(function (c, i) {
    var h = 0.11 + (i % 2) * 0.03;
    var b = box(0.8 - i * 0.05, h, 0.58, mat(c, { roughness: 0.75 }), 1.62, sy + h / 2, -0.62);
    b.rotation.y = (i % 2 ? 0.14 : -0.1) + i * 0.03; scene.add(b); sy += h;
  });
  var white = mat(0xf4f4f4, { roughness: 0.35 });
  var mug = new THREE.Group();
  mug.add(cyl(0.13, 0.11, 0.26, white, 0, 0, 0));
  var coffee = new THREE.Mesh(new THREE.CircleGeometry(0.115, 24), mat(0x3b2415, { roughness: 0.3 }));
  coffee.rotation.x = -Math.PI / 2; coffee.position.y = 0.125; mug.add(coffee);
  var handle = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.022, 10, 20), white);
  handle.position.set(0.14, 0, 0); mug.add(handle);
  var MUG_HOME = V(1.0, TOP + 0.13, -0.32);
  mug.position.copy(MUG_HOME); scene.add(mug);
  var MUG_OFFSET = V(-0.05, -0.02, -0.17);          // mug position relative to the hand holding it
  var GRAB = MUG_HOME.clone().sub(MUG_OFFSET);
  var MOUTH = V(0.13, 2.97, -0.27);
  var pencil = cyl(0.02, 0.02, 0.5, gold, -1.0, TOP + 0.02, 0.6);
  pencil.rotation.set(Math.PI / 2, 0, 0.5); scene.add(pencil);

  // ---------- Neural network that lights up when the robot has an idea ----------
  var holo = new THREE.Group(); holo.position.set(1.75, 3.15, -0.9); scene.add(holo);
  var holoNodes = [], layers = [3, 4, 2], linePts = [];
  layers.forEach(function (n, li) {
    for (var k = 0; k < n; k++) {
      var m = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12),
        new THREE.MeshBasicMaterial({ color: 0x5ff1ff, transparent: true, opacity: 0.25 }));
      m.position.set((li - 1) * 0.55, (k - (n - 1) / 2) * 0.34, 0);
      m.userData.layer = li; holo.add(m); holoNodes.push(m);
    }
  });
  holoNodes.forEach(function (a) { holoNodes.forEach(function (b) {
    if (b.userData.layer === a.userData.layer + 1) linePts.push(a.position.clone(), b.position.clone());
  }); });
  var holoLineMat = new THREE.LineBasicMaterial({ color: 0x35d6e8, transparent: true, opacity: 0.15 });
  holo.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(linePts), holoLineMat));
  var holoEnergy = 0;

  // ---------- Floating text, sleep Zs, confetti ----------
  var floaters = [];
  function textSprite(text, color, size) {
    var c = document.createElement("canvas"); c.width = 384; c.height = 96;
    var g = c.getContext("2d");
    g.font = "700 52px 'Segoe UI', system-ui, Arial, sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle";
    g.shadowColor = color; g.shadowBlur = 14; g.fillStyle = color; g.fillText(text, 192, 50);
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0, depthWrite: false }));
    s.scale.set(1.5 * size, 0.375 * size, 1); return s;
  }
  function addFloater(s, pos, vel, life) {
    s.position.copy(pos); s.userData = { age: 0, life: life, vel: vel };
    scene.add(s); floaters.push(s);
  }
  var wordIndex = 0;
  function burstWords() {
    for (var k = 0; k < 3; k++) {
      var s = textSprite(WORDS[wordIndex % WORDS.length], wordIndex % 2 ? "#ffc857" : "#5ff1ff", 1);
      wordIndex++;
      addFloater(s, V((k - 1) * 1.15, TOP + 0.5 + (k % 2) * 0.35, 0.5), V((k - 1) * 0.22, 0.55, 0.15), 3.6);
    }
  }
  function spawnZ(n) {
    var p = V(0, 0.55, 0.3); head.localToWorld(p);
    addFloater(textSprite("z", "#b8c8e6", 0.6 + n * 0.25), p, V(0.28, 0.5, 0.05), 2.2);
  }
  var confetti = [], confettiGeo = new THREE.PlaneGeometry(0.07, 0.12);
  var confettiColors = [0x35d6e8, 0xffc857, 0xc8553d, 0x6f5bb5, 0x3d8f6f, 0xffffff];
  function burstConfetti() {
    for (var k = 0; k < 90; k++) {
      var m = new THREE.Mesh(confettiGeo, new THREE.MeshBasicMaterial({ color: confettiColors[k % 6], side: THREE.DoubleSide }));
      m.position.set((Math.random() - 0.5) * 0.6, 3.6, -0.9);
      m.userData = { v: V((Math.random() - 0.5) * 4.2, 2.5 + Math.random() * 3.2, (Math.random() - 0.5) * 3 + 0.6),
        spin: V(Math.random() * 8, Math.random() * 8, Math.random() * 8) };
      scene.add(m); confetti.push(m);
    }
  }

  // ---------- What the robot does ----------
  // Each entry is [action, seconds]. The robot repeats this list until a student clicks.
  var ROUTINE = [["read", 3.5], ["turn", 1.3], ["read", 3], ["drowsy", 3.4], ["jolt", 1.4], ["read", 2],
                 ["sip", 3.6], ["read", 2.4], ["turn", 1.3], ["eureka", 3], ["read", 2]];
  var routineI = 0, act = { name: "read", t: 0, dur: 1.3 }, greeted = false;
  var flash = 0, energy = 0, zCount = 0, mugHeld = false, celebrate = false;
  var said = 0;   // how many clicks the student has made in this round

  function startAct(name, dur) {
    act = { name: name, t: 0, dur: dur };
    flipPivot.visible = name === "turn";
    zCount = 0;
    if (name === "eureka") { flash = 1; holoEnergy = 1; burstWords(); }
  }
  function nextAct() { var r = ROUTINE[routineI % ROUTINE.length]; routineI++; startAct(r[0], r[1]); }
  function say(text, seconds) {
    celebrate = false;
    bubble.textContent = text; bubble.classList.add("on");
    startAct("talk", seconds || 5);
  }
  function hush() { bubble.classList.remove("on"); }

  function onRobotClick() {
    greeted = true;
    var chips = stepsEl.children;
    if (said >= N + 1) { said = 0; for (var k = 0; k < N; k++) chips[k].classList.remove("done"); }
    if (said < N) {
      say("Step " + (said + 1) + " of " + N + ". " + STEPS[said].say, 6);
      chips[said].classList.add("done");
      said++;
      promptEl.textContent = said < N ? "Click the robot for step " + (said + 1) + "." : "Click the robot one more time.";
    } else {
      say(FINISH, 6);
      celebrate = true; flash = 1; holoEnergy = 1; burstConfetti();
      said++;
      promptEl.textContent = "You have all " + N + " steps. Click the robot to see them again.";
    }
  }

  // ---------- Pointer: a click talks to the robot, a drag turns the camera ----------
  var az = 0.48, azTarget = 0.48, el = 0.28, elTarget = 0.28;
  var down = false, moved = 0, lastX = 0, lastY = 0, userMoved = 0;
  canvas.addEventListener("pointerdown", function (e) { down = true; moved = 0; lastX = e.clientX; lastY = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", function (e) {
    if (!down) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 8) {
      azTarget -= dx * 0.006;
      elTarget = Math.max(0.06, Math.min(0.85, elTarget + dy * 0.004));
      userMoved = 6;
    }
    lastX = e.clientX; lastY = e.clientY;
  });
  canvas.addEventListener("pointerup", function () { if (down && moved <= 8) onRobotClick(); down = false; });
  canvas.addEventListener("pointercancel", function () { down = false; });
  canvas.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onRobotClick(); } });

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.9 ? 60 : 33;
    camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  // ---------- Frame loop ----------
  var clock = new THREE.Clock(), simT = 0, nextBlink = 2, blinkT = -1;
  var REST_L = V(-0.8, TOP + 0.14, 0.02), REST_R = V(0.8, TOP + 0.14, 0.02);
  var tgtL = V(0, 0, 0), tgtR = V(0, 0, 0), tmp = V(0, 0, 0), mugTgt = V(0, 0, 0), headTop = V(0, 0, 0);
  var face = { open: 1, happy: 0, wide: 1, lookX: 0, lookY: 0, mouth: "flat", mo: 0 };
  var pendingSave = false;

  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05);
    simT += dt; var t = simT;
    act.t += dt;
    if (act.t >= act.dur) {
      if (act.name === "talk") { hush(); celebrate = false; }
      if (act.name === "sip") energy = 1;
      if (!greeted) { greeted = true; say(GREETING, 6); } else nextAct();
    }
    var p = clamp01(act.t / act.dur);

    // Targets for this action
    tgtL.copy(REST_L); tgtR.copy(REST_R);
    var yaw = 0, pitch = 0.46, roll = 0, jump = 0, mugTilt = 0;
    face.open = 1; face.happy = 0; face.wide = 1; face.lookX = 0; face.lookY = 0.7; face.mouth = "flat"; face.mo = 0;
    mugHeld = false;

    switch (act.name) {
      case "read":
        var sweep = (t * 0.55) % 1;
        yaw = -0.2 + sweep * 0.4; face.lookX = -0.7 + sweep * 1.4;
        pitch += Math.sin(t * 0.8) * 0.02;
        break;
      case "turn":
        var th = 0.08 + ease(p) * (Math.PI - 0.16);
        flipPivot.rotation.z = th;
        if (p < 0.8) tgtR.set(Math.cos(th) * 0.62, TOP + 0.24 + Math.sin(th) * 0.62, 0.38);
        yaw = 0.18 - p * 0.36; face.lookX = 0.6 - p * 1.2;
        break;
      case "drowsy":
        pitch = 0.46 + p * 0.32 + Math.sin(p * Math.PI * 3) * 0.05;
        roll = p * 0.14; face.open = Math.max(0.1, 1 - p * 1.1); face.lookY = 1;
        if (act.t > 0.9 + zCount * 0.8 && zCount < 3) { spawnZ(zCount); zCount++; }
        break;
      case "jolt":
        pitch = 0.05; yaw = Math.sin(p * Math.PI * 6) * 0.28 * (1 - p);
        jump = Math.sin(seg(p, 0, 0.35) * Math.PI) * 0.14;
        face.wide = 1.35; face.mouth = "o"; face.lookY = 0;
        break;
      case "sip":
        if (p < 0.2) { tgtR.lerpVectors(REST_R, GRAB, ease(seg(p, 0, 0.2))); }
        else if (p < 0.45) { mugHeld = true; tgtR.lerpVectors(GRAB, MOUTH, ease(seg(p, 0.2, 0.45))); }
        else if (p < 0.7) { mugHeld = true; tgtR.copy(MOUTH); mugTilt = Math.sin(seg(p, 0.45, 0.7) * Math.PI) * 0.95; }
        else if (p < 0.9) { mugHeld = true; tgtR.lerpVectors(MOUTH, GRAB, ease(seg(p, 0.7, 0.9))); }
        else { tgtR.lerpVectors(GRAB, REST_R, ease(seg(p, 0.9, 1))); }
        if (p > 0.2 && p < 0.9) { pitch = 0.12 - mugTilt * 0.3; yaw = 0.12; face.lookY = 0.2; }
        if (p > 0.4 && p < 0.78) { face.happy = 1; }
        if (p >= 0.78 && p < 0.9) { face.mouth = "smile"; }
        break;
      case "eureka":
        var shake = Math.sin(t * 16) * 0.05;
        tgtL.set(-1.2 + shake, 3.35, -0.85); tgtR.set(1.2 - shake, 3.35, -0.85);
        pitch = -0.08; yaw = az * 0.5; jump = Math.abs(Math.sin(p * Math.PI * 3)) * 0.08;
        if (p < 0.2) { face.wide = 1.35; face.mouth = "o"; face.lookY = 0; } else { face.happy = 1; face.mouth = "smile"; }
        break;
      case "talk":
        yaw = Math.max(-0.95, Math.min(0.95, az)); pitch = -el * 0.55; roll = Math.sin(t * 2.2) * 0.05;
        face.lookY = 0; face.happy = 1; face.mouth = "talk"; face.mo = Math.abs(Math.sin(t * 10)) * (act.t < act.dur - 1.6 ? 1 : 0.15);
        if (celebrate) {
          var sh2 = Math.sin(t * 14) * 0.08;
          tgtL.set(-1.2 + sh2, 3.35, -0.85); tgtR.set(1.2 - sh2, 3.35, -0.85);
          jump = Math.abs(Math.sin(t * 6)) * 0.1 * (1 - p);
        } else if (act.t < 2.6) {
          tgtR.set(1.25 + Math.sin(t * 9) * 0.22, 3.25, -0.75);
        }
        break;
    }

    // Blink (skipped when the eyes are already doing something)
    if (t > nextBlink) { blinkT = 0; nextBlink = t + 2.2 + Math.random() * 2.6; }
    if (blinkT >= 0) {
      blinkT += dt;
      var bk = blinkT < 0.07 ? 1 - blinkT / 0.07 : Math.min(1, (blinkT - 0.07) / 0.09);
      if (!face.happy) face.open = Math.min(face.open, Math.max(0.1, bk));
      if (blinkT > 0.16) blinkT = -1;
    }
    drawFace(face);

    // Ease the body toward its targets so actions blend into each other
    var k = 1 - Math.exp(-dt * 9), kFast = 1 - Math.exp(-dt * 16);
    head.rotation.y = lerp(head.rotation.y, yaw, k);
    head.rotation.x = lerp(head.rotation.x, pitch, act.name === "jolt" ? kFast : k);
    head.rotation.z = lerp(head.rotation.z, roll, k);
    robot.position.y = lerp(robot.position.y, jump, kFast);
    head.position.y = HEAD_Y + Math.sin(t * 1.6) * 0.012;
    armL.pos.lerp(tgtL, k); armR.pos.lerp(tgtR, k);
    // The shoulders ride on the body when it hops
    solveArm(armL); solveArm(armR);

    // Mug follows the hand while held, then returns to the desk
    if (mugHeld) { armR.hand.getWorldPosition(mugTgt); mugTgt.add(MUG_OFFSET); mug.position.lerp(mugTgt, 1 - Math.exp(-dt * 30)); }
    else mug.position.lerp(MUG_HOME, 1 - Math.exp(-dt * 14));
    mug.rotation.x = lerp(mug.rotation.x, -mugTilt, kFast);

    // Antenna, chest, and the neural network
    flash = Math.max(0, flash - dt * 0.7);
    energy = Math.max(0, energy - dt * 0.2);
    holoEnergy = Math.max(0, holoEnergy - dt * 0.28);
    bulbMat.emissiveIntensity = 0.5 + Math.sin(t * 3) * 0.15 + flash * 2.6;
    bulbLight.intensity = flash * 1.8;
    bulb.scale.setScalar(1 + flash * 0.6);
    for (var i = 0; i < chestBars.length; i++) {
      chestBars[i].scale.y = 0.3 + 0.7 * Math.abs(Math.sin(t * (2.2 + energy * 7) + i * 0.9));
    }
    var wave = (t * 2.4) % 3.4 - 0.2;
    for (var n = 0; n < holoNodes.length; n++) {
      var hit = Math.max(0, 1 - Math.abs(wave - holoNodes[n].userData.layer)) * holoEnergy;
      holoNodes[n].material.opacity = 0.22 + 0.45 * holoEnergy + 0.33 * hit;
      holoNodes[n].scale.setScalar(1 + hit * 0.9);
    }
    holoLineMat.opacity = 0.14 + 0.6 * holoEnergy;
    holo.rotation.y = Math.sin(t * 0.5) * 0.35 - 0.3;
    holo.position.y = 3.15 + Math.sin(t * 0.9) * 0.05;
    holo.scale.setScalar(1 + holoEnergy * 0.25);

    // Floating text and confetti
    for (var j = floaters.length - 1; j >= 0; j--) {
      var s = floaters[j], u = s.userData;
      u.age += dt; s.position.addScaledVector(u.vel, dt);
      s.material.opacity = Math.sin(clamp01(u.age / u.life) * Math.PI) * 0.95;
      if (u.age >= u.life) { scene.remove(s); s.material.map.dispose(); s.material.dispose(); floaters.splice(j, 1); }
    }
    for (var c = confetti.length - 1; c >= 0; c--) {
      var m = confetti[c], cu = m.userData;
      cu.v.y -= 6.5 * dt; cu.v.multiplyScalar(1 - dt * 0.9);
      m.position.addScaledVector(cu.v, dt);
      m.rotation.x += cu.spin.x * dt; m.rotation.y += cu.spin.y * dt; m.rotation.z += cu.spin.z * dt;
      if (m.position.y < 0.02) { scene.remove(m); m.material.dispose(); confetti.splice(c, 1); }
    }

    // Camera drifts slowly unless the viewer is dragging
    userMoved = Math.max(0, userMoved - dt);
    if (userMoved === 0 && !down) {
      azTarget += (0.42 + Math.sin(t * 0.22) * 0.26 - azTarget) * dt * 0.6;
      elTarget += (0.28 - elTarget) * dt * 0.6;
    }
    az += (azTarget - az) * Math.min(1, dt * 6);
    el += (elTarget - el) * Math.min(1, dt * 6);
    var R = 9.4;
    camera.position.set(lookTarget.x + R * Math.sin(az) * Math.cos(el), lookTarget.y + R * Math.sin(el), lookTarget.z + R * Math.cos(az) * Math.cos(el));
    camera.lookAt(lookTarget);
    renderer.render(scene, camera);

    // Keep the speech bubble above the robot's head
    headTop.set(0, 1.05, 0); head.localToWorld(headTop); headTop.project(camera);
    var bx = (headTop.x * 0.5 + 0.5) * window.innerWidth, by = (-headTop.y * 0.5 + 0.5) * window.innerHeight;
    var half = bubble.offsetWidth / 2 + 10;
    var cx = Math.max(half, Math.min(window.innerWidth - half, bx));
    by = Math.max(bubble.offsetHeight + 12, by);
    bubble.style.left = cx + "px"; bubble.style.top = by + "px";
    bubble.style.setProperty("--tail", (50 + (bx - cx) / Math.max(1, bubble.offsetWidth) * 100) + "%");

    if (pendingSave && act.name === "talk" && act.t > 1.1 && act.t < 2.4) { pendingSave = false; capture(bx, by); }
    requestAnimationFrame(frame);
  }
  drawFace(face);
  requestAnimationFrame(frame);

  // ---------- Save a still image for the email ----------
  // Add #instructor to the end of the page address to show the button. Students never see it.
  function roundRect(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function capture(bx, by) {
    var W = 1200, H = 675, out = document.createElement("canvas"); out.width = W; out.height = H;
    var g = out.getContext("2d"), sw = canvas.width, sh = canvas.height;
    var scale = Math.max(W / sw, H / sh), dw = sw * scale, dh = sh * scale, ox = (W - dw) / 2, oy = (H - dh) / 2;
    g.fillStyle = "#0b1220"; g.fillRect(0, 0, W, H);
    g.drawImage(canvas, ox, oy, dw, dh);
    var f = "'Segoe UI', system-ui, Arial, sans-serif";

    // speech bubble
    var px = ox + bx / window.innerWidth * dw, py = Math.max(96, oy + by / window.innerHeight * dh);
    g.font = "700 30px " + f;
    var tw = g.measureText(IMAGE_BUBBLE).width + 44;
    var rx = Math.max(20, Math.min(W - tw - 20, px - tw / 2));
    g.fillStyle = "#ffffff"; roundRect(g, rx, py - 66, tw, 56, 16); g.fill();
    g.beginPath(); g.moveTo(px - 12, py - 11); g.lineTo(px + 12, py - 11); g.lineTo(px, py + 5); g.closePath(); g.fill();
    g.fillStyle = "#0b1220"; g.textBaseline = "middle"; g.fillText(IMAGE_BUBBLE, rx + 22, py - 37);

    var grad = g.createLinearGradient(0, H - 190, 0, H);
    grad.addColorStop(0, "rgba(7,12,24,0)"); grad.addColorStop(1, "rgba(7,12,24,0.96)");
    g.fillStyle = grad; g.fillRect(0, H - 190, W, 190);
    g.textBaseline = "top";
    g.font = "800 68px " + f; g.fillStyle = "#eaf2ff"; g.fillText("ARIN", 44, 36);
    var aw = g.measureText("ARIN ").width;
    g.fillStyle = "#35d6e8"; g.fillText("320", 44 + aw, 36);
    g.font = "400 26px " + f; g.fillStyle = "#b8c8e6"; g.fillText("Artificial Intelligence Applications", 46, 116);
    g.textBaseline = "alphabetic";
    g.font = "700 32px " + f; g.fillStyle = "#ffc857"; g.fillText(FIRST_CLASS, 44, H - 74);
    g.font = "700 22px " + f;
    var label = "▶  " + IMAGE_BUTTON, lw = g.measureText(label).width + 36;
    g.fillStyle = "#18b6c9"; roundRect(g, 44, H - 58, lw, 40, 8); g.fill();
    g.fillStyle = "#06101f"; g.fillText(label, 62, H - 30);

    out.toBlob(function (blob) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "arin320-welcome-robot.png";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }, "image/png");
  }
  var saveBtn = document.getElementById("save");
  saveBtn.addEventListener("click", function () { greeted = true; azTarget = 0.42; userMoved = 0; say(GREETING, 5); pendingSave = true; });
  if (location.hash === "#instructor") saveBtn.style.display = "block";

  window.arinRobot = { start: startAct, click: onRobotClick };
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>startRobot();</script>
